<div class="kpi-grid">
  @for (kpi of kpis; track kpi.titulo) {
  <div class="kpi-card">
    <div class="kpi-header">
      <span class="kpi-title">{{ kpi.titulo }}</span>
      <i [class]="kpi.icon" [style.color]="kpi.cor"></i>
    </div>
    <div class="kpi-body">
      <span class="kpi-value">{{ kpi.valor }}</span>
      <span class="kpi-badge" [class.positive]="kpi.variacao.startsWith('+')"
        [class.negative]="kpi.variacao.startsWith('-')">
        {{ kpi.variacao }}
      </span>
    </div>
  </div>
  }
</div>
